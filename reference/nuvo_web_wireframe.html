<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nuvo Circle — clickable wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #58CC02;
    --green-dark: #3C8C0A;
    --green-deep: #2B7A0B;
    --green-pale: #EAF9D8;
    --blue: #1CB0F6;
    --blue-dark: #1594CC;
    --blue-pale: #E1F5FE;
    --purple: #CE82FF;
    --purple-dark: #A557D6;
    --purple-pale: #F5E9FF;
    --gold: #FFC800;
    --gold-dark: #E0A800;
    --gold-pale: #FFF6D9;
    --orange: #FF9600;
    --orange-dark: #DB7F00;
    --pink: #FF86D0;
    --pink-dark: #D65AA8;
    --ink: #3C3C3C;
    --ink-soft: #6B6B6B;
    --ink-mute: #AFAFAF;
    --line: #E5E5E5;
    --bg: #FFFFFF;
    --bg-soft: #F7F7F7;
    --cream: #FFF3D6;
    --display: "Baloo 2", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
    --chiku-scale: #6CCB2C;
    --chiku-scale-dark: #3F9A0C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background: #ececec;
    min-height: 100vh;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue-dark); outline-offset: 2px; }
  h1, h2, h3, .display { font-family: var(--display); font-weight: 700; margin: 0; }
  p { margin: 0; }

  .chrome {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 14px;
    background: #1f1f1f;
    color: white;
  }
  .chrome strong { font-family: var(--display); font-weight: 700; margin-right: 6px; }
  .chrome span.note { color: #cfcfcf; font-size: 13px; }
  .chrome button {
    background: #333;
    color: white;
    border: 2px solid #555;
    border-radius: 999px;
    padding: 4px 10px;
    font-family: var(--display);
    font-size: 14px;
  }
  .chrome button[aria-pressed="true"] { background: var(--green); color: var(--ink); border-color: var(--green-dark); }

  .stage { display: flex; justify-content: center; padding: 18px 12px 40px; }
  .app {
    width: min(1120px, 100%);
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    min-height: 760px;
    display: flex;
    flex-direction: column;
  }
  .app.phone { width: 390px; min-height: 780px; border-radius: 28px; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 2px solid var(--line);
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; }
  .brand b { font-family: var(--display); font-size: 22px; }
  .spacer { flex: 1; }
  .stat {
    display: flex; align-items: center; gap: 6px;
    border: 2px solid var(--line); border-radius: 999px;
    padding: 4px 10px; background: var(--bg);
    font-family: var(--display); font-size: 16px;
  }
  .stat.flame { color: var(--orange-dark); }
  .stat.gc { background: var(--gold-pale); border-color: var(--gold); }
  .lvl {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--green-pale); border: 2px solid var(--green);
    display: grid; place-items: center;
    font-family: var(--display); color: var(--green-deep);
  }
  .avatar-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--blue-pale); padding: 0;
    font-size: 20px;
  }

  .shell { display: grid; grid-template-columns: 196px 1fr 296px; flex: 1; min-height: 0; }
  .nav, .rail { padding: 14px; }
  .nav { border-right: 2px solid var(--line); }
  .rail { border-left: 2px solid var(--line); background: var(--bg-soft); display: flex; flex-direction: column; gap: 12px; }
  .main { padding: 16px 18px 28px; overflow: auto; }
  .nav button, .tabbar button {
    width: 100%; text-align: left; background: transparent; border: 0;
    border-radius: 12px; padding: 10px 12px;
    font-family: var(--display); font-size: 16px; color: var(--ink-soft);
    display: flex; gap: 8px; align-items: center;
  }
  .nav button[aria-current="page"], .tabbar button[aria-current="page"] {
    background: var(--green-pale); color: var(--green-deep);
  }
  .tabbar { display: none; border-top: 2px solid var(--line); background: white; }
  .tabbar button { justify-content: center; flex-direction: column; font-size: 12px; gap: 2px; padding: 8px 4px; }
  .today { display: none; }

  .card {
    background: white;
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .callout { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .callout .bubble { flex: 1; }
  .kicker { font-family: var(--display); color: var(--green-deep); font-size: 14px; }

  .banner {
    border-radius: 16px; color: var(--ink); padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    margin: 8px 0 0;
  }
  .banner h2 { font-size: 26px; }
  .banner p { font-weight: 700; }
  .banner.water { background: var(--blue); }
  .banner.waste { background: var(--purple); }
  .banner.nature { background: var(--green); }
  .banner.locked { background: #dedede; color: var(--ink-soft); }
  .banner .count { font-family: var(--display); font-size: 18px; }

  .path {
    position: relative;
    height: 560px;
    margin: 4px 0 8px;
  }
  .path svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node {
    position: absolute;
    width: 68px; height: 68px; border-radius: 50%;
    border: 0; border-bottom: 6px solid var(--green-dark);
    background: var(--green); color: var(--ink);
    display: grid; place-items: center;
    transform: translate(-50%, -50%);
    font-family: var(--display); font-size: 22px;
  }
  .node.done { background: var(--green); border-bottom-color: var(--green-dark); }
  .node.current {
    width: 82px; height: 82px;
    background: var(--gold); border-bottom-color: var(--gold-dark);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .node.locked {
    background: white; border: 2px solid var(--line); border-bottom: 6px solid #cfcfcf;
    color: var(--ink-mute);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 200, 0, 0.55); }
    70% { box-shadow: 0 0 0 12px rgba(255, 200, 0, 0); }
  }
  .more { text-align: center; color: var(--ink-soft); margin: 8px 0 16px; font-weight: 700; }

  .btn {
    font-family: var(--display);
    background: var(--green);
    color: var(--ink);
    border: 0;
    border-bottom: 4px solid var(--green-dark);
    border-radius: 13px;
    padding: 10px 16px;
    font-size: 16px;
  }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .btn.blue { background: var(--blue); border-bottom-color: var(--blue-dark); }
  .btn.gold { background: var(--gold); border-bottom-color: var(--gold-dark); }
  .btn.ghost {
    background: white; border: 2px solid var(--line); border-bottom-width: 4px;
  }
  .btn.full { width: 100%; }
  .btn:disabled { background: var(--bg-soft); border-bottom-color: var(--line); color: var(--ink-mute); }

  .row { display: flex; gap: 8px; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .muted { color: var(--ink-soft); }
  .tiny { color: var(--ink-mute); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 2px 8px;
    font-family: var(--display); font-size: 13px;
    background: var(--gold-pale); border: 2px solid var(--gold);
  }
  .pill.green { background: var(--green-pale); border-color: var(--green); }
  .pill.grey { background: var(--bg-soft); border-color: var(--line); color: var(--ink-soft); }
  .pill.pink { background: #ffe6f6; border-color: var(--pink); }

  .bar {
    height: 12px; border-radius: 999px; background: var(--bg-soft);
    border: 2px solid var(--line); overflow: hidden;
  }
  .bar > span { display: block; height: 100%; background: var(--green); }
  .quest { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; }
  .quest .bar { grid-column: 1 / -1; }

  .sheet {
    position: absolute; left: 16px; right: 16px; bottom: 16px;
    z-index: 5;
  }
  .path-wrap { position: relative; }

  .stepper { display: flex; gap: 6px; margin-bottom: 12px; }
  .stepper button {
    flex: 1; border-radius: 12px; border: 2px solid var(--line);
    background: white; padding: 8px; font-family: var(--display);
  }
  .stepper button[aria-current="step"] { background: var(--blue-pale); border-color: var(--blue); }

  .option, .choice {
    width: 100%; text-align: left;
    background: white; border: 2px solid var(--line); border-bottom-width: 4px;
    border-radius: 13px; padding: 12px 14px; margin-bottom: 8px;
    font-weight: 700;
  }
  .option[aria-pressed="true"], .choice.correct { border-color: var(--green); background: var(--green-pale); }
  .choice.learn { border-color: var(--gold); background: var(--gold-pale); }
  .chip {
    border: 2px solid var(--line); background: white; border-radius: 999px;
    padding: 6px 12px; font-family: var(--display);
  }
  .chip[aria-pressed="true"] { background: var(--orange); border-color: var(--orange-dark); }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button {
    border: 2px solid var(--line); background: white; border-radius: 999px;
    padding: 6px 12px; font-family: var(--display);
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: white; border-color: var(--ink); }

  .league-row, .hist {
    display: grid; grid-template-columns: 28px 36px 1fr auto;
    gap: 8px; align-items: center;
    padding: 8px; border-radius: 12px;
  }
  .league-row.you { background: var(--gold-pale); border: 2px solid var(--gold); }
  .divider {
    text-align: center; color: var(--green-deep); font-family: var(--display);
    font-size: 13px; margin: 6px 0; padding: 4px;
    border-top: 2px dashed var(--green);
  }
  .hero {
    background: var(--blue-pale); border: 2px solid var(--blue); border-radius: 16px;
    padding: 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
  }
  .lock-badge { font-family: var(--display); font-size: 13px; color: var(--ink-soft); }

  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
  .dots i.on { background: var(--green-deep); }

  .badge {
    aspect-ratio: 1; border: 2px solid var(--line); border-radius: 16px;
    display: grid; place-items: center; text-align: center; padding: 8px;
    font-family: var(--display); font-size: 13px; background: white;
  }
  .badge.earned { background: var(--green-pale); border-color: var(--green); }
  .badge.locked { color: var(--ink-mute); }

  .ring {
    width: 72px; height: 72px; border-radius: 50%;
    display: grid; place-items: center; font-family: var(--display);
    border: 8px solid var(--line); background: white;
  }

  .modal-back {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    display: grid; place-items: center; z-index: 40; padding: 16px;
  }
  .modal { width: min(420px, 100%); }

  .mascot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mascot-cell { text-align: center; }
  .sizes { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }

  .menu {
    position: absolute; right: 12px; top: 58px; width: 200px; z-index: 6;
  }
  .menu button { width: 100%; text-align: left; background: white; border: 0; border-radius: 10px; padding: 8px; font-family: var(--display); }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .stage { padding: 0; }
    .app { width: 100%; border-radius: 0; border: 0; min-height: 100vh; }
    .shell { grid-template-columns: 1fr; }
    .nav, .rail { display: none; }
    .tabbar { display: flex; }
    .today { display: block; margin-bottom: 12px; }
    .grid3 { grid-template-columns: 1fr 1fr; }
  }
  .app.phone .shell { grid-template-columns: 1fr; }
  .app.phone .nav, .app.phone .rail { display: none; }
  .app.phone .tabbar { display: flex; }
  .app.phone .today { display: block; margin-bottom: 12px; }
  .app.phone .topbar .stat.lvl-label { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .node.current { animation: none; }
    .bounce { animation: none !important; }
  }
  .bounce { animation: bounce 0.8s ease; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
  }
  .confetti { position: relative; }
  .confetti i {
    position: absolute; width: 6px; height: 6px; border-radius: 2px;
  }
</style>
</head>

<script>
const TRAIL = "M75,36 C75,78 225,70 225,124 C225,178 75,168 75,232 C75,286 225,276 225,340 C225,394 75,384 75,448";

function chiku(mood, size, level) {
  const scale = level >= 5 ? "#58CC02" : level >= 3 ? "#6CCB2C" : "#A9D98A";
  const dark = level >= 5 ? "#2F8F00" : level >= 3 ? "#3F9A0C" : "#86BD64";
  const face = mood === "curled" ? "" : `<use href="#chiku-face-${mood === "celebrate" ? "happy" : mood}"/>`;
  const body = mood === "curled" ? `<use href="#chiku-curled"/>` : `<use href="#chiku-body"/>${face}`;
  const scarf = level >= 5 ? `<use href="#chiku-scarf"/>` : "";
  const bounce = mood === "celebrate" ? " bounce" : "";
  return `<span class="confetti${bounce}" style="display:inline-block;width:${size}px;height:${size}px;--chiku-scale:${scale};--chiku-scale-dark:${dark}">
    <svg viewBox="0 0 110 110" width="${size}" height="${size}" aria-hidden="true">${body}${scarf}</svg>
  </span>`;
}

  const btn = state === "Unlock"
    ? `<button class="btn ${primary ? "" : "blue"}" type="button" data-unlock="${title}">Unlock</button>`

let current = "path";

function setNav(screen) {
  document.querySelectorAll(".nav button, .tabbar button").forEach(btn => {
    const on = btn.dataset.screen === screen;
    if (on) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });
}

function show(screen) {
  current = screen;
  const bare = screen === "welcome";
  document.getElementById("topbar").classList.toggle("hidden", bare);
  document.getElementById("shell").style.display = bare ? "block" : "";
  document.querySelector(".tabbar").classList.toggle("hidden", bare);
  document.getElementById("rail").innerHTML = bare ? "" : rail();
  document.getElementById("main").innerHTML = screens[screen]();
  document.getElementById("menu").classList.add("hidden");
  setNav(screen === "mission" ? "path" : screen);
  if (screen === "mission") fillStep("learn");
  wire();
}

function fillStep(name) {
  const body = document.getElementById("step-body");
  if (!body) return;
  body.innerHTML = steps[name];
  document.querySelectorAll(".stepper button").forEach(b => {
    if (b.dataset.step === name) b.setAttribute("aria-current", "step");
    else b.removeAttribute("aria-current");
  });
  wire();
}

function wire() {
  document.querySelectorAll("[data-screen]").forEach(el => {
    el.onclick = () => show(el.dataset.screen);
  });
  document.querySelectorAll("[data-step]").forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); fillStep(el.dataset.step); };
  });
  const sheet = document.getElementById("sheet");
  document.querySelectorAll("[data-node]").forEach(node => {
    node.onclick = () => {
      const kind = node.dataset.node;
      sheet.classList.remove("hidden");
      if (kind === "current") {
        sheet.innerHTML = `<h3>Water detective</h3><p>Find 3 places water is wasted at home.</p><p class="pill">+80 GC</p><button class="btn full" type="button" data-screen="mission" style="margin-top:8px">Start</button>`;
      } else if (kind === "done") {
        sheet.innerHTML = `<h3>Already done</h3><p>You can read it again any time.</p><button class="btn ghost full" type="button" data-screen="mission">Look again</button>`;
      } else {
        sheet.innerHTML = `<h3>Locked</h3><p>Finish Water detective to open the next mission.</p>`;
      }
      wire();
    };
  });
  const submit = document.getElementById("submit-mission");
  if (submit) submit.onclick = () => {
    document.getElementById("pending").classList.remove("hidden");
    submit.disabled = true;
  };
  const grown = document.getElementById("to-grownup");
  if (grown) grown.onclick = () => document.getElementById("grown").classList.remove("hidden");
  const toLeague = document.getElementById("to-league");
  if (toLeague) toLeague.onclick = () => {
    if (!document.getElementById("consent").checked) return;
    document.getElementById("league-opt").classList.remove("hidden");
  };
  document.querySelectorAll("[data-unlock]").forEach(btn => {
    btn.onclick = () => {
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-back" id="modal">
          <div class="card modal stack">
            <h3>Unlock ${btn.dataset.unlock}?</h3>
            <p>This spends Green Credits. A grown-up will be asked to confirm the booking.</p>
            <div class="row"><button class="btn" type="button" id="confirm">Unlock</button><button class="btn ghost" type="button" id="cancel">Not now</button></div>
            <p id="voucher" class="hidden kicker">Unlocked. A grown-up will be asked to confirm the booking.</p>
          </div>
        </div>`;
      document.getElementById("cancel").onclick = () => { document.getElementById("modal-root").innerHTML = ""; };
      document.getElementById("confirm").onclick = () => document.getElementById("voucher").classList.remove("hidden");
    };
  });
  const school = document.getElementById("school-tab");
  const city = document.getElementById("city-tab");
  if (school) {
    const empty = `<div class="card stack" style="align-items:center;text-align:center">${chiku("idle", 72, 4)}<h3>Class league is the one with people in it</h3><p>School and city boards arrive later. Your class list is ready now.</p></div>`;
    school.onclick = () => { document.getElementById("league-body").innerHTML = empty; };
    city.onclick = () => { document.getElementById("league-body").innerHTML = empty; };
  }
}

document.getElementById("avatar").onclick = (e) => {
  e.stopPropagation();
  document.getElementById("menu").classList.toggle("hidden");
};
document.getElementById("desk").onclick = () => {
  document.getElementById("app").classList.remove("phone");
  document.getElementById("desk").setAttribute("aria-pressed", "true");
  document.getElementById("phone").setAttribute("aria-pressed", "false");
};
document.getElementById("phone").onclick = () => {
  document.getElementById("app").classList.add("phone");
  document.getElementById("phone").setAttribute("aria-pressed", "true");
  document.getElementById("desk").setAttribute("aria-pressed", "false");
};
document.getElementById("logo-chiku").innerHTML = chiku("idle", 36, 4);
document.getElementById("rail").innerHTML = rail();
show("path");
</script>
</body>
</html>
